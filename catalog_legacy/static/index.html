<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="상황으로 알림 코드를 찾고, 유사 문구를 비교하고, 중복 없이 새 문구를 준비하는 기획자의 코드 라이브러리.">
<title>Code Library · 알림 코드 관리</title>
<link rel="stylesheet" href="/static/styles.css"><script defer src="/static/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">본문으로 이동</a>
<div class="app-shell">
 <aside class="sidebar">
  <a class="brand" href="/" aria-label="Code Library 홈"><span class="brand-mark">c<span>·</span></span><span>Code Library<small>기획자의 알림 코드 공간</small></span></a>
  <div class="workspace-label">WORKSPACE <span>01</span></div>
  <nav id="nav" aria-label="주 메뉴">
   <button class="nav-item active" data-view="search"><span class="nav-icon">⌕</span>코드 찾기<span class="keycap">/</span></button>
   <button class="nav-item" data-view="compare"><span class="nav-icon">⇄</span>문구 비교</button>
   <button class="nav-item" data-view="review"><span class="nav-icon">☷</span>기획서 검토</button>
   <div class="nav-divider"></div>
   <button class="nav-item" data-view="new"><span class="nav-icon">＋</span>새 문구 작성</button>
   <button class="nav-item" data-view="drafts"><span class="nav-icon">▱</span>초안함<span id="draft-count" class="count">0</span></button>
   <button class="nav-item" data-view="catalog"><span class="nav-icon">▦</span>전체 코드</button>
   <button class="nav-item" data-view="import"><span class="nav-icon">↥</span>엑셀 가져오기</button>
   <button class="nav-item" data-view="audit"><span class="nav-icon">◷</span>변경 기록</button>
  </nav>
  <div class="sidebar-bottom"><div class="engine-note"><span class="status-dot"></span><span id="engine-label">연결 확인 중</span></div><p>원문은 그대로.<br>새로운 문구는 검토 후에.</p><button class="text-button" data-action="settings">연결 및 운영 기준</button></div>
 </aside>
 <div class="main-shell">
  <header class="topbar"><div class="breadcrumb">라이브러리 <span>/</span> <strong id="breadcrumb">코드 찾기</strong></div><div class="top-actions"><span id="auth-label" class="muted small"></span><button id="namespace-button" class="environment" data-action="namespace">실제 목록 <span>⇄</span></button><button class="avatar" data-action="lock" aria-label="접속 키 변경">P</button></div></header>
  <div id="demo-banner" class="demo-banner hidden">예시 모드입니다. 모든 항목은 테스트용이며 실제 목록과 분리됩니다.<button data-action="namespace">실제 목록으로 돌아가기 →</button></div>
  <main id="main" tabindex="-1"><div id="content"></div></main>
  <footer><span>Code Library <span class="footer-separator">/</span> 기획부터 구현까지, 같은 문구로.</span><span id="footer-version"></span></footer>
 </div>
</div>
<div id="toast" role="status" aria-live="polite" class="toast hidden"></div>
<dialog id="detail-dialog" aria-labelledby="detail-title"><div id="detail-content"></div></dialog>
<dialog id="auth-dialog" aria-labelledby="auth-title"><form id="auth-form" class="auth-form"><span class="eyebrow">PRIVATE WORKSPACE</span><h2 id="auth-title">코드 라이브러리에 접속하세요.</h2><p class="muted">관리자가 발급한 접속 키를 입력해주세요.<br>이 브라우저 탭의 세션에만 저장됩니다.</p><label>접속 키<input type="password" name="token" id="auth-token" autocomplete="current-password" required></label><div id="auth-error" role="alert" class="error-text"></div><button class="button primary" type="submit">접속하기 →</button></form></dialog>
</body></html>
