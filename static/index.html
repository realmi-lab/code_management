<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="메시지 코드 검색과 문구 관리">
<title>Code Library · 알림 코드 관리</title>
<link rel="icon" href="static/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="static/styles.css"><script defer src="static/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">본문으로 이동</a>
<div class="app-shell">
 <aside class="sidebar">
  <a class="brand" href="./" aria-label="Code Library 홈"><span class="brand-mark">c<span>·</span></span><span>Code Library</span></a>
  <nav id="nav" aria-label="주 메뉴">
   <button class="nav-item active" data-view="search"><span class="nav-icon"><svg class="ui-icon" width="18" height="18" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="static/assets/icons.svg#magnifying-glass"></use></svg></span>코드 찾기<kbd class="keycap">/</kbd></button>
   <button class="nav-item" data-view="compare"><span class="nav-icon"><svg class="ui-icon" width="18" height="18" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="static/assets/icons.svg#arrows-left-right"></use></svg></span>문구 비교</button>
   <button class="nav-item" data-view="review"><span class="nav-icon"><svg class="ui-icon" width="18" height="18" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="static/assets/icons.svg#list-checks"></use></svg></span>기획서 검토</button>
   <div class="nav-divider"></div>
   <button class="nav-item" data-view="new"><span class="nav-icon"><svg class="ui-icon" width="18" height="18" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="static/assets/icons.svg#plus"></use></svg></span>새 문구</button>
   <button class="nav-item" data-view="drafts"><span class="nav-icon"><svg class="ui-icon" width="18" height="18" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="static/assets/icons.svg#tray"></use></svg></span>초안함<span id="draft-count" class="count">0</span></button>
   <button class="nav-item" data-view="catalog"><span class="nav-icon"><svg class="ui-icon" width="18" height="18" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="static/assets/icons.svg#table"></use></svg></span>전체 코드</button>
   <button class="nav-item" data-view="import"><span class="nav-icon"><svg class="ui-icon" width="18" height="18" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="static/assets/icons.svg#upload-simple"></use></svg></span>엑셀 가져오기</button>
   <button class="nav-item" data-view="audit"><span class="nav-icon"><svg class="ui-icon" width="18" height="18" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="static/assets/icons.svg#clock-counter-clockwise"></use></svg></span>변경 기록</button>
  </nav>
  <div class="sidebar-bottom"><div class="engine-note"><span class="status-dot"></span><span id="engine-label">연결 확인 중</span></div><button class="text-button" data-action="settings"><svg class="ui-icon" width="18" height="18" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="static/assets/icons.svg#gear-six"></use></svg>설정</button></div>
 </aside>
 <div class="main-shell">
  <header class="topbar"><div class="breadcrumb"><strong id="breadcrumb">코드 찾기</strong></div><div class="top-actions"><span id="auth-label" class="muted small"></span><button id="namespace-button" class="environment" data-action="namespace">실제 목록 <svg class="ui-icon" width="18" height="18" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="static/assets/icons.svg#arrows-left-right"></use></svg></button><button class="avatar hidden" data-action="lock" aria-label="접속 키 변경" title="접속 잠금"><svg class="ui-icon" width="18" height="18" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="static/assets/icons.svg#lock-simple"></use></svg></button></div></header>
  <div id="demo-banner" class="demo-banner hidden">예시 데이터<button data-action="namespace">실제 목록 보기</button></div>
  <div id="catalog-banner" class="catalog-notice hidden" role="note"></div>
  <main id="main" tabindex="-1"><div id="content"></div></main>
  <footer><span id="footer-version"></span></footer>
 </div>
</div>
<div id="toast" role="status" aria-live="polite" class="toast hidden"></div>
<dialog id="detail-dialog" aria-labelledby="detail-title"><div id="detail-content"></div></dialog>
<dialog id="auth-dialog" aria-labelledby="auth-title"><form id="auth-form" class="auth-form"><h2 id="auth-title">라이브러리 접속</h2><label>접속 키<input type="password" name="token" id="auth-token" autocomplete="current-password" required></label><div id="auth-error" role="alert" class="error-text"></div><button class="button primary" type="submit">접속</button></form></dialog>
</body></html>
