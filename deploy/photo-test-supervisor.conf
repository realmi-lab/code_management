[unix_http_server]
file=%(here)s/../.runtime/photo-test-supervisor.sock
chmod=0700

[supervisord]
logfile=%(here)s/../.runtime/photo-test-supervisor.log
logfile_maxbytes=2MB
logfile_backups=2
pidfile=%(here)s/../.runtime/photo-test-supervisord.pid
childlogdir=%(here)s/../.runtime

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/../.runtime/photo-test-supervisor.sock

[program:code-management-photo-test]
directory=%(here)s/..
command=%(here)s/../.venv/bin/python -u %(here)s/../run.py
environment=PORT="8767",BIND_HOST="127.0.0.1",DATA_DIR="/shared/code_management/data/photo-test",CATALOG_LABEL="사진 테스트 목록",CATALOG_NOTICE="사진에서 읽은 33건으로 테스트 중입니다. 잘린 제목과 일부 기호는 원본 확인이 필요합니다."
autostart=true
autorestart=true
startsecs=2
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=%(here)s/../.runtime/photo-test-app.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=2
redirect_stderr=true
umask=0077
