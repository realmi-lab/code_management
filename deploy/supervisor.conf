[unix_http_server]
file=%(here)s/../.runtime/supervisor.sock
chmod=0700

[supervisord]
logfile=%(here)s/../.runtime/supervisor.log
logfile_maxbytes=2MB
logfile_backups=2
pidfile=%(here)s/../.runtime/supervisord.pid
childlogdir=%(here)s/../.runtime

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/../.runtime/supervisor.sock

[program:code-management]
directory=%(here)s/..
command=%(here)s/../.venv/bin/python -u %(here)s/../run.py
autostart=true
autorestart=true
startsecs=2
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=%(here)s/../.runtime/app.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=2
redirect_stderr=true
umask=0077
